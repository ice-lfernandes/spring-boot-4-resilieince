spring:
  application:
    name: ecommerce-resilience-api
  
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  
  h2:
    console:
      enabled: true
      path: /h2-console

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
    instances:
      paymentService:
        baseConfig: default
        waitDurationInOpenState: 15s
        recordExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
        ignoreExceptions:
          - com.ecommerce.exception.BusinessException
      inventoryService:
        baseConfig: default
        failureRateThreshold: 40
      externalApi:
        baseConfig: default
      
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
    instances:
      inventoryService:
        maxAttempts: 4
        waitDuration: 500ms
        retryExceptions:
          - com.ecommerce.exception.InventoryServiceException
          - org.springframework.web.reactive.function.client.WebClientResponseException$ServiceUnavailable
        ignoreExceptions:
          - com.ecommerce.exception.ProductNotFoundException
      paymentService:
        maxAttempts: 2
        waitDuration: 1000ms
      externalApi:
        maxAttempts: 3
        waitDuration: 500ms
        
  ratelimiter:
    configs:
      default:
        registerHealthIndicator: true
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 100ms
    instances:
      productSearch:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 0s
        registerHealthIndicator: true
        eventConsumerBufferSize: 100
      productDetail:
        limitForPeriod: 500
        limitRefreshPeriod: 1s
        timeoutDuration: 100ms
        registerHealthIndicator: true
      smsNotification:
        limitForPeriod: 10
        limitRefreshPeriod: 1m
      externalApi:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        
  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 10
        maxWaitDuration: 100ms
    instances:
      smsNotification:
        maxConcurrentCalls: 5
        maxWaitDuration: 0ms
      externalApi:
        maxConcurrentCalls: 10
        
  thread-pool-bulkhead:
    configs:
      default:
        maxThreadPoolSize: 5
        coreThreadPoolSize: 3
        queueCapacity: 20
        keepAliveDuration: 20ms
    instances:
      emailNotification:
        maxThreadPoolSize: 5
        coreThreadPoolSize: 3
        queueCapacity: 20
        
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
        cancelRunningFuture: true
    instances:
      paymentService:
        timeoutDuration: 5s
        cancelRunningFuture: true
      inventoryService:
        timeoutDuration: 3s
      externalApi:
        timeoutDuration: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,circuitbreakers,ratelimiters,retries,bulkheads
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        resilience4j.circuitbreaker.calls: true
        resilience4j.ratelimiter.calls: true
        resilience4j.retry.calls: true
    tags:
      application: ${spring.application.name}
      
logging:
  level:
    io.github.resilience4j: DEBUG
    com.ecommerce: DEBUG
